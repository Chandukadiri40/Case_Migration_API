spring.application.name=db-search

# Server Port
server.port=8080

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.file.name=logs/migration-report.log
logging.logback.rollingpolicy.file-name-pattern=logs/migration-report_%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.level.com.migrationreport=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%-5level] [%thread] %logger{36} : %replace(%msg){'[\r\n]', ''}%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%-5level] [%thread] %logger{36} : %replace(%msg){'[\r\n]', ''}%n

# FileNet Architecture Setting - fixed mapping for primary & system columns
app.filenet.fixed-mapping=true
app.filenet.vm-ip=192.168.1.103
app.filenet.ce-url=https://192.168.1.103:9443/wsi/FNCEWS40MTOM/


# Exceptions Module Configuration
exceptions.search.max-date-range-months=3


# Migration Rates
migration.docsPerHour=50000
migration.hoursPerDay=4














# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=jdbc:postgresql://192.168.1.143:5432/ISMigration
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver
app.database.type=postgres

# Search Configuration for docversion table (Lowercase is standard for PostgreSQL)
# Target table containing FileNet documents to search
search.target-table=docversion

# Multi-Table search configurations
search.tables.source=docversion_source
search.tables.staging=docversion_staging
search.tables.target=docversion_target

# System columns mappings (Short key -> physical SSMS column name)
search.system-columns.doc-id=OBJECT_ID
search.system-columns.created-date=CREATE_DATE
search.system-columns.content-size=CONTENT_SIZE
search.system-columns.mime-type=MIME_TYPE

# Date range filtering column configuration
search.date-column=CREATE_DATE

# Status column name in your SSMS tables
search.status-column=MIGRATION_STATUS

# Table-specific Allowed Custom Columns in SSMS
search.tables.source.custom-columns=U1708_DOCUMENTTITLE,UA8C8_USER_NAME,UD5E8_ADDRESS,UC7A6_ORDER_NO
search.tables.staging.custom-columns=U1708_DOCUMENTTITLE
search.tables.target.custom-columns=U1708_DOCUMENTTITLE,UA8C8_USER_NAME,UD5E8_ADDRESS,UC7A6_ORDER_NO



# Authentication Configuration (Ensure users table exists in PostgreSQL database)
auth.users-table=users
auth.username-column=username
auth.password-column=password

# Checksum Table Configuration
checksum.table=ISCHECKSUMTABLE

# Global Column Configuration (For Reports, Deliverables, Exceptions)
search.report.system-properties=object_id,mime_type,content_size
search.report.custom-metadata=*
search.report.extra-properties=extracted_status,extracted_date,migrated_date,migration_status,error_info,filefullpath,folderpath,retrivalname,p8_doc_id

# Security Error Disclosure settings
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Linux Document Explorer Configuration (Configurable via ENV or application.properties)
linux.documents.base-path=${LINUX_DOCUMENTS_BASE_PATH:/home/skts/IS Migration}
linux.documents.host-ip=${LINUX_DOCUMENTS_HOST_IP:192.168.19.182}
linux.documents.ssh.username=${LINUX_DOCUMENTS_SSH_USERNAME:skts}
linux.documents.ssh.password=${LINUX_DOCUMENTS_SSH_PASSWORD:Skts@123}
linux.documents.ssh.port=${LINUX_DOCUMENTS_SSH_PORT:22}


# ==========================================
# TrueMigrator Directory Paths & Executables
# ==========================================
truemigrate.paths.storage-mount-path=/home/skts/IS Migration
truemigrate.paths.documents-path=/home/skts/IS Migration/IS Documents
truemigrate.paths.case-migration-dir=/home/skts/IS Migration/Migration_Tools/CaseMigration
truemigrate.paths.is-migration-dir=/home/skts/IS Migration/Migration_Tools/TrueMigrator
truemigrate.paths.case-import-jar-path=/home/skts/IS Migration/Migration_Tools/CaseMigration/CaseImport/case-import-0.0.1.jar
truemigrate.paths.filenet-migrator-cmd=dotnet TrueMigrator.dll
truemigrate.paths.is-extraction-script=python3 /opt/truemigrate/scripts/extract_is_docs.py
truemigrate.paths.case-extraction-jar-path=/home/skts/IS Migration/Migration_Tools/CaseMigration/CaseExtraction/case-extraction-0.0.1.jar
truemigrate.paths.case-transformation-jar-path=/home/skts/IS Migration/Migration_Tools/CaseMigration/CaseTransformation/case-transformation-0.0.1.jar
truemigrate.paths.log-directory-path=/var/log/truemigrate

# Offline Extraction Settings & Paths
truemigrate.paths.offline-index-db-table=DOCTABA_STAGING_TABLE
truemigrate.paths.offline-mkf-export-path=/mnt/truemigrate/staging/mkf db
truemigrate.paths.offline-msar-dat-path=/mnt/truemigrate/staging/msar-dat
truemigrate.paths.offline-file-pattern=*.dat


